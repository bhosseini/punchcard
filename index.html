<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#EFEAE0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Punchcard</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --paper:#EFEAE0; --card:#F7F4EE; --ink:#17161C; --ink-40:#7A756C;
  --rule:#DCD5C6; --slot:#F3EFE6; --tray:#E4DCCB; --sunk:#DCD4C3; --sunk2:#C9C0AD;
  --violet:#5B3DF5; --orange:#FF5A1F; --teal:#0F8B8D; --magenta:#D6266F; --olive:#6B8F3A;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sb:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --paper:#171231; --card:#211B42; --ink:#EFE9F8; --ink-40:#9C94B9;
  --rule:#352C5C; --slot:#251E49; --tray:#120E27; --sunk:#2B2356; --sunk2:#3B3169;
  --violet:#9B84FF; --orange:#FF8A57; --teal:#38C3C4; --magenta:#F8619E; --olive:#A6CB63;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overscroll-behavior:none;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
  transition:background .3s ease,color .3s ease;}
button,input{font:inherit;color:inherit;}

#app{height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative;}
@media(min-width:760px){
  body{background:#2A2731;display:grid;place-items:center;}
  #app{height:min(880px,94vh);width:404px;border-radius:34px;overflow:hidden;background:var(--paper);
    box-shadow:0 30px 70px -20px #000a,0 0 0 9px #131218,0 0 0 10px #3a3742;}
}

/* ── header ─────────────────────────────── */
header{padding:calc(env(safe-area-inset-top,0px) + 14px) 22px 12px;flex:none;}
.eyebrow{display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-40);text-transform:uppercase;}
.icobtn{background:none;border:none;color:var(--ink-40);cursor:pointer;padding:4px;margin:-4px;
  line-height:0;border-radius:6px;}
.icobtn:hover{color:var(--ink);}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em;
  margin:8px 0 0;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;}
#sky{border:none;background:none;padding:0;line-height:0;flex:none;
  width:104px;height:64px;margin:-12px 0 -10px 0;pointer-events:none;}
#sky[hidden]{display:none;}
#count:not(:empty)::after{content:" · ";}

.strip{display:flex;gap:2px;margin-top:14px;height:26px;padding:4px;background:var(--tray);
  border-radius:6px;box-shadow:inset 0 1px 3px #00000022;}
.cell{flex:1;border-radius:2px;background:var(--slot);transition:background .5s ease;}
.cell.now{animation:pulse 1.6s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.striplab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;
  color:var(--ink-40);letter-spacing:.08em;margin-top:5px;}

nav{display:flex;gap:6px;padding:0 22px 8px;flex:none;}
nav button{flex:1;border:1px solid var(--rule);background:transparent;color:var(--ink-40);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:9px 0;border-radius:8px;cursor:pointer;transition:all .18s ease;}
nav button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}

main{flex:1;overflow-y:auto;padding:2px 22px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
main::-webkit-scrollbar{display:none;}
main[hidden]{display:none;}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-40);margin:18px 0 6px;display:flex;align-items:center;gap:8px;}
.sect::after{content:"";flex:1;height:1px;background:var(--rule);}

/* ── task row ───────────────────────────── */
.row{position:relative;display:flex;align-items:flex-start;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--rule);animation:rowin .3s cubic-bezier(.2,.9,.3,1.2);
  user-select:none;-webkit-user-select:none;}
.row.lift{z-index:9;border-bottom-color:transparent;background:var(--card);
  border-radius:13px;padding:12px 12px;margin:0 -12px;animation:none;
  box-shadow:0 14px 30px #00000038,0 0 0 1px var(--rule);cursor:grabbing;}
[data-theme="dark"] .row.lift{box-shadow:0 14px 34px #00000070,0 0 0 1px var(--rule);}
.row.lift .bar i{transition:none;}
@keyframes rowin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.row.leaving{animation:rowout .3s ease forwards;}
@keyframes rowout{to{opacity:0;transform:translateX(28px);height:0;padding:0;margin:0;border:0}}
.punch{flex:none;width:27px;height:27px;border-radius:50%;border:2px solid var(--ink);
  background:var(--card);cursor:pointer;margin-top:1px;position:relative;transition:transform .12s ease;padding:0;}
.punch:active{transform:scale(.85);}
.punch.hit{animation:punchit .45s cubic-bezier(.3,1.6,.4,1);}
@keyframes punchit{0%{transform:scale(1)}35%{transform:scale(.5)}100%{transform:scale(1)}}
.punch.done{border-color:var(--sunk2)!important;background:var(--sunk);box-shadow:inset 0 2px 4px #00000038;}
.punch.done::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--sunk2);}
.mid{min-width:0;flex:1;cursor:pointer;position:relative;}
.title{font-size:15.5px;font-weight:500;line-height:1.3;position:relative;display:inline-block;
  word-break:break-word;}
.title.struck{color:var(--ink-40);}
.title.struck::after{content:"";position:absolute;left:-2px;top:52%;height:1.5px;background:currentColor;
  width:calc(100% + 4px);transform-origin:left;animation:strike .28s ease forwards;}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:2.5px 6px;border-radius:4px;border:1px solid currentColor;}
.t{font-family:var(--mono);font-size:11.5px;color:var(--ink-40);font-weight:500;}
.t.live{color:var(--orange);}
/* Absolutely positioned, so it sits in the row's existing bottom padding instead of
   adding to the row's height. In flow it was height:3px + margin-top:8px, so the
   moment a timer ticked 0s -> 1s the bar appeared, the row grew 11px, and the whole
   list below it jumped down. Out of flow, appearing costs no layout. */
.bar{position:absolute;left:0;right:0;bottom:-11px;height:3px;border-radius:2px;
  background:var(--tray);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:2px;transition:width .6s ease;}
.act{margin-left:auto;flex:none;}
.play{width:36px;height:36px;border-radius:10px;border:1px solid var(--rule);background:var(--card);
  display:grid;place-items:center;cursor:pointer;transition:all .15s ease;padding:0;}
.play.on{background:var(--orange);border-color:var(--orange);color:#fff;}
.chad{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;left:11px;top:15px;
  animation:chad .7s ease-out forwards;}
@keyframes chad{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}

.empty{text-align:center;padding:44px 20px;color:var(--ink-40);font-size:14px;line-height:1.7;}

/* ── composer ───────────────────────────── */
#rail{flex:none;display:flex;align-items:stretch;gap:7px;padding:7px 16px 8px;
  border-top:1px solid var(--rule);background:var(--paper);}
#rail[hidden]{display:none;}
.railbtn{width:60px;border:1px solid var(--rule);background:transparent;color:var(--ink);
  border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0;min-height:46px;
  transition:all .15s ease;}
.railbtn:active{background:var(--tray);transform:scale(.96);}
.railbtn:disabled{opacity:.2;}
.railday{flex:1;border:1px solid var(--rule);background:transparent;color:var(--ink-40);
  border-radius:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;cursor:pointer;min-height:46px;transition:all .15s ease;}
.railday.away{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.railbtn:focus-visible,.railday:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
footer{flex:none;padding:9px 16px calc(9px + var(--sb));background:var(--card);border-top:1px solid var(--rule);}
.compose{display:flex;align-items:center;gap:8px;}
#new{flex:1;border:none;background:transparent;font-size:15.5px;padding:10px 2px;min-width:0;}
#new:focus{outline:none;}
#new::placeholder{color:var(--ink-40);}
.tog{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);background:transparent;color:var(--ink-40);padding:7px 9px;
  border-radius:7px;cursor:pointer;transition:all .15s;}
.tog.on{background:var(--violet);border-color:var(--violet);color:#fff;}
.plus{width:39px;height:39px;border-radius:11px;border:none;background:var(--ink);color:var(--paper);
  font-size:23px;line-height:1;cursor:pointer;flex:none;transition:transform .12s;padding:0;}
.plus:active{transform:scale(.9);}

/* ── stats ──────────────────────────────── */
.big{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:4px;}
.note{font-size:13px;color:var(--ink-40);line-height:1.55;margin-top:8px;}
.kpis{display:flex;gap:8px;margin-top:14px;}
.kpi{flex:1;border:1px solid var(--rule);border-radius:10px;padding:10px;}
.kpi b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;}
.kpi span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40);}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.dot{width:15px;height:15px;border-radius:4px;background:var(--tray);}
.dot.hit{background:var(--olive);}
.dot.today{box-shadow:0 0 0 1.5px var(--ink);}
.streak{padding:12px 0;border-bottom:1px solid var(--rule);}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
svg text{font-family:var(--mono);fill:var(--ink-40);}

/* ── sheet ──────────────────────────────── */
#scrim{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;}
#scrim.open{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:21;
  border-radius:20px 20px 0 0;padding:18px 22px calc(22px + var(--sb));
  transform:translateY(101%);transition:transform .3s cubic-bezier(.2,.9,.3,1);
  max-width:520px;margin:0 auto;max-height:88dvh;overflow-y:auto;border-top:1px solid var(--rule);}
@media(min-width:760px){.sheet{width:404px;left:50%;transform:translate(-50%,101%);
  bottom:max(0px,calc(50dvh - min(440px,47vh)));border-radius:20px;}
  .sheet.open{transform:translate(-50%,0);}}
.sheet.open{transform:translateY(0);}
.grab{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:-6px auto 14px;}
.sheet h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0 0 14px;letter-spacing:-.02em;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-40);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:10px 12px;border-radius:9px;
  border:1px solid var(--rule);background:var(--paper);font-size:15px;}
.field input:focus,.field select:focus{outline:2px solid var(--violet);outline-offset:1px;}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;}
.pill{border:1px solid var(--rule);background:transparent;color:var(--ink-40);padding:8px 11px;
  border-radius:8px;font-family:var(--mono);font-size:11px;cursor:pointer;}
.pill.on{background:var(--violet);border-color:var(--violet);color:#fff;}
.sbtn{width:100%;padding:13px;border-radius:11px;border:none;background:var(--ink);color:var(--paper);
  font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.sbtn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink);}
.sbtn.danger{background:transparent;border:1px solid var(--magenta);color:var(--magenta);}
.srowline{display:flex;justify-content:space-between;align-items:center;padding:13px 0;
  border-bottom:1px solid var(--rule);font-size:15px;}
.srowline:last-of-type{border-bottom:none;}
.switch{width:46px;height:27px;border-radius:14px;background:var(--rule);border:none;position:relative;
  cursor:pointer;flex:none;transition:background .2s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:var(--card);transition:transform .2s;}
.switch.on{background:var(--violet);}
.switch.on::after{transform:translateX(19px);}

#datelab{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;}
.row.ghost{opacity:.5;}
.row.past .mid{cursor:default;}
.ghostdot{flex:none;width:27px;height:27px;border-radius:50%;border:2px dotted var(--rule);
  margin-top:1px;display:block;}
#m-today{will-change:transform,opacity;touch-action:pan-y;}
#warn{margin:10px 22px 0;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.45;
  background:#FFE9E0;color:#8A2C0B;border:1px solid #F5C0AA;}
[data-theme="dark"] #warn{background:#3A1E14;color:#FFC3A8;border-color:#5C3020;}
#warn[hidden]{display:none;}
#toast{position:fixed;left:50%;bottom:calc(88px + var(--sb));transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper);padding:11px 15px;border-radius:11px;font-size:14px;
  display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;
  box-shadow:0 8px 24px #0004;}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
#toast button{background:none;border:none;color:var(--violet);font-weight:600;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
[data-theme="dark"] #toast button{color:#B9A6FF;}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">
      <span id="datelab">—</span>
      <button class="icobtn" id="gear" aria-label="Settings">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
        </svg>
      </button>
    </div>
    <h1><span id="screen">Today</span><button id="sky" aria-label="Sky and weather"></button></h1>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="striplab"><span><span id="count"></span><span id="logged"></span></span>
      <span id="cardlen"></span></div>
  </header>

  <div id="warn" hidden>This page can't save to storage, so anything you add will be
    lost when you close it. Opening the file from Downloads is the usual cause — hosting
    it fixes this for good.</div>

  <nav role="tablist">
    <button role="tab" data-tab="today" aria-selected="true">today</button>
    <button role="tab" data-tab="rhythm" aria-selected="false">rhythm</button>
  </nav>

  <main id="m-today"></main>
  <main id="m-rhythm" hidden></main>

  <div id="rail">
    <button class="railbtn" id="prevday" aria-label="Previous day">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="railday" id="railday">Today</button>
    <button class="railbtn" id="nextday" aria-label="Next day">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <footer id="composer">
    <div class="compose">
      <input id="new" placeholder="Add to the card…" autocomplete="off" enterkeyhint="done">
      <button class="tog" id="dailytog" aria-pressed="false">daily</button>
      <button class="plus" id="addbtn" aria-label="Add task">+</button>
    </div>
  </footer>
</div>

<div id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetbody"></div></div>
<div id="toast"><span id="toastmsg"></span><button id="toastact">Undo</button></div>

<script>
/* ═══ Punchcard — local-first daily task card ════════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const HUES=["--violet","--orange","--teal","--magenta","--olive"];
/* Alternate palettes for the punch colours. Each slot stays in its own hue family
   across every palette (violet-ish, orange-ish, teal-ish, magenta-ish, olive-ish) —
   those same five vars also drive fixed-meaning UI (the live-timer dot, the
   hole-punch checkmark, danger buttons), so a palette swap can't let a slot drift
   into a different family or those lose their meaning. One is chosen per logical
   day in rollover(), never repeating the previous day's. */
const PALETTES=[
  {light:["#5B3DF5","#FF5A1F","#0F8B8D","#D6266F","#6B8F3A"], dark:["#9B84FF","#FF8A57","#38C3C4","#F8619E","#A6CB63"]},
  {light:["#6425F7","#FF4500","#00B8D9","#FF1493","#7ED321"], dark:["#B39DFF","#FF9466","#4DE8FF","#FF6FC4","#B4E346"]},
  {light:["#7D6B9E","#C1743D","#4A8C82","#B85C7A","#8A8C4E"], dark:["#A493C4","#D89563","#6FADA3","#D183A0","#B0B26E"]},
  {light:["#6D28D9","#C2410C","#0E7490","#A21CAF","#4D7C0F"], dark:["#C4B5FD","#FDBA74","#67E8F9","#F0ABFC","#BEF264"]},
];
/* applyTheme() runs on every render() too — same story as paintSky(), skip the
   5 custom-property writes unless the theme or the day's palette actually changed. */
let lastPaletteKey=null;
function paintPalette(){
  const dark=document.documentElement.dataset.theme==="dark";
  const idx=S.palette?.idx||0;
  const key=dark+":"+idx;
  if(key===lastPaletteKey) return;
  lastPaletteKey=key;
  const set=PALETTES[idx][dark?"dark":"light"];
  HUES.forEach((v,i)=>document.documentElement.style.setProperty(v,set[i]));
}
const KEY="punchcard.v1";
/* Shown at the bottom of Settings. No build step here, so bump this by hand in the
   same commit as any change worth telling the phones apart by — it exists so you can
   confirm at a glance whether a device actually picked up the latest push. */
const VERSION="2026.08.14c";
let hueSeq=0;   // declared up here: load() assigns it before the format helpers run

let mem=null;        // fallback if storage is blocked (e.g. sandboxed preview)
let storageOK=true;  // false = changes won't survive closing; we warn on screen
try{ localStorage.setItem("__pc_probe","1"); localStorage.removeItem("__pc_probe"); }
catch(e){ storageOK=false; }
const store={
  get(){ try{ return localStorage.getItem(KEY); }catch(e){ return mem; } },
  set(v){ try{ localStorage.setItem(KEY,v); }catch(e){ storageOK=false; mem=v; } }
};

const blank={
  rev:0, savedAt:0, tasks:[], plans:{}, history:{}, lastDay:null, running:null,
  settings:{theme:"auto",sound:true,haptics:true,cardHours:8,dayStart:4,autoStop:4,sky:true,weather:false}
};
const demo=[
  {title:"Walk the dog",daily:true,target:20},
  {title:"Coursework reading",daily:true,target:60},
  {title:"Two job applications",daily:false,target:45},
];

let S=load(), tab="today", newDaily=false, undoBuf=null, undoTimer=null;
let view=0;                       // 0 = today, +n = days ahead, -n = days behind
const MAX_AHEAD=30;

/* ── the timer ────────────────────────────────
   Never counts ticks. S.running = {id, since:<epoch ms>} is written to
   storage, so elapsed time is always (now − since): correct after the
   screen sleeps, after you switch apps, after Chrome kills the tab,
   after a reboot. commit() folds live time into the task and re-anchors. */
const activeId=()=>S.running?S.running.id:null;
const liveSec=t=>(S.running&&S.running.id===t.id)
  ? Math.max(0,Math.floor((Date.now()-S.running.since)/1000)) : 0;
const secOf=t=>t.sec+liveSec(t);

function commit(){
  if(!S.running) return;
  const t=S.tasks.find(x=>x.id===S.running.id);
  if(!t){ S.running=null; return; }
  t.sec+=liveSec(t); S.running.since=Date.now();
}
function stopTimer(){ commit(); S.running=null; }

/* a timer left running overnight isn't real work — cap the session */
function checkAutoStop(){
  const cap=S.settings.autoStop;
  if(!S.running||!cap) return false;
  const t=S.tasks.find(x=>x.id===S.running.id);
  if(!t) { S.running=null; return false; }
  const over=liveSec(t)-cap*3600;
  if(over<=0) return false;
  t.sec+=cap*3600; S.running=null; save();
  toast(`Timer auto-stopped at ${cap}h on “${t.title}”`);
  return true;
}

function hydrate(d){
  d.settings={...blank.settings,...(d.settings||{})};
  d.tasks=d.tasks||[]; d.plans=d.plans||{}; d.history=d.history||{}; d.rev=d.rev||0;
  d.tasks.forEach((t,i)=>{ if(t.hueIdx==null) t.hueIdx=i; });
  hueSeq=Math.max(hueSeq,...d.tasks.map(t=>t.hueIdx+1),0);
  return d;
}
function load(){
  let d;
  try{ d=JSON.parse(store.get()); }catch(e){ d=null; }
  if(!d||!d.tasks){
    d=JSON.parse(JSON.stringify(blank));
    d.tasks=demo.map(t=>mk(t.title,t.daily,t.target));
  }
  return hydrate(d);
}

/* Every write carries a revision number. Open the file twice and you get two
   copies of the app; without this, whichever one closes last silently
   overwrites the other with whatever it happened to be holding. A passive
   write (heartbeat, backgrounding, closing) never overwrites a newer
   revision — it steps aside and adopts it. Only a deliberate edit wins. */
function save(passive){
  let stored=null;
  try{ const raw=store.get(); if(raw) stored=JSON.parse(raw); }catch(e){}
  if(stored&&(stored.rev||0)>(S.rev||0)){
    if(passive){ S=hydrate(stored); queueRender(); return; }
    S.rev=stored.rev;
  }
  S.rev=(S.rev||0)+1; S.savedAt=Date.now();
  store.set(JSON.stringify(S));
}
const queueRender=()=>setTimeout(()=>{ if(!drag) render(); },0);

function mk(title,daily,target){
  return {id:Date.now()+Math.random().toString(36).slice(2,6),title,daily:!!daily,
    done:false,sec:0,target:target||null,created:Date.now(),hueIdx:hueSeq++};
}

/* ── day handling ─────────────────────────── */
function keyAt(offset){
  const d=new Date(); d.setDate(d.getDate()+offset); return dayKey(d);
}
function dayName(offset){
  if(offset===0) return "Today";
  if(offset===1) return "Tomorrow";
  if(offset===-1) return "Yesterday";
  const d=new Date(); d.setDate(d.getDate()+offset);
  return d.toLocaleDateString(undefined,{weekday:"long"});
}

/* Only the live "Today" heading (view===0) ever shows a greeting instead of the
   plain word — plans, history, and every other day name are untouched. Picked
   at most a few times a day (morning/afternoon/night), not on every render;
   see the slot check in render(). */
const GREETING_MAX=24;                        // longer lines wrap to 3+ lines — looks broken
const GREET_GENERAL=["Clock in.","Lock in.","Time to cook.","We have work to do.",
  "Eyes on the prize.","Get after it.","Make it happen.","Let's get to work.",
  "Punch the clock.","Dial it in.","Showtime.","Let's get this bread.","You know what to do.",
  "The list awaits...","The quest continues.","The journey continues.","Destiny awaits.",
  "The path is clear.","The hour has come.","Rise, adventurer.","Fate has work for you.",
  "Your objectives await.","Onward.","Into the breach.","The saga continues.","Your move.",
  "Beast mode.","Main character energy.","We've got this.","Easy money.","No sweat.",
  "Big day.","Let's roll.","We ball.","You got this.","Looking productive today.",
  "Certified doer.","Built different.","Problem solver online.","Absolutely locked in.",
  "We move.","Say less.","Let's make some progress.","Today's looking good.",
  "Oh god, there's tasks.","Here we go again.","Surely this will be fine.",
  "What could possibly go wrong?","Task me up, Scotty.","Let's pretend we're organized.",
  "Productivity.exe loading...","The list has opinions.","The chores have summoned you.",
  "Unfortunately, there is work to do.","Fine. I'll do it.","You made the list. Now face it.",
  "The audacity of these tasks.","Who put all these things here?",
  "Future you is counting on you.","Past you left a mess.","The task monster hungers.",
  "Another beautiful opportunity to be productive.","We can't keep ignoring these.",
  "Today we fight the list.","One thing at a time.","No rush. Just progress.",
  "Small steps count.","Nice and easy.","Let's take it one task at a time.",
  "A little progress is still progress.","You've got time.","Keep moving forward.",
  "Gentle productivity.","Let's make today count.","Just start somewhere.",
  "We've got plenty to do. No panic.","Progress, not perfection.","One checkbox at a time.",
  "The list has spoken.","Behold: today's tasks.","Your objectives have been updated.",
  "New day. New tasks.","Loading today's nonsense...","Daily briefing:",
  "Mission control online.","The dashboard is yours.","Your quest log has updated.",
  "Objectives received.","Today's campaign:","Current directive:","Status: probably fine.",
  "Let's see what we're working with."];
const GREET_MORNING=["Fresh day, fresh list.","New day, new chances.","Morning briefing.",
  "Coffee first. Then we conquer.","The day is yours.","Let's get this day started.",
  "The sun is up. Unfortunately, so are we."];
const GREET_NIGHT=["Still time to get stuff done.","The day isn't over yet.","We've got time.",
  "Keep the momentum.","Don't call it a day just yet.","One last push.","Finish strong.",
  "Let's close this out.","The night shift begins."];
const GREET_WX={
  rain:["Rainy day, same tasks.","Good day to stay in.","Cozy inside, busy inside.",
    "Let it pour. Let's work.","Rain check? Not today."],
  snow:["Snow day. Not off day.","Cold out, warm progress.","Let it snow. Let's go.",
    "Bundle up and dig in.","A little frosty today."],
  storm:["Loud sky, quiet focus.","Storm's here. Tasks too.","Thunder out, focus in.",
    "Stay in. Get it done.","Weather the storm."],
};
function period(){
  const h=new Date().getHours();
  if(h>=5&&h<12) return "morning";
  if(h>=12&&h<18) return "afternoon";
  return "night";
}
function pickGreeting(){
  const wx=S.settings.weather?WX((S.sky||{}).code):null;
  const wxPool=GREET_WX[wx];
  let pool = (wxPool&&Math.random()<0.5) ? wxPool
    : GREET_GENERAL.concat(period()==="morning"?GREET_MORNING:period()==="night"?GREET_NIGHT:[]);
  pool = pool.filter(s=>s.length<=GREETING_MAX);
  if(!pool.length) return "Today";
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1&&pick===S.greeting?.text) pick=pool[Math.floor(Math.random()*pool.length)];
  return pick;
}
/* you can plan a month out; you can look back as far as there's a record */
function backLimit(){
  const days=Object.keys(S.history).filter(k=>Object.keys(S.history[k].per||{}).length
    ||(S.history[k].completed||[]).length).sort();
  if(!days.length) return 0;
  const first=new Date(days[0]+"T12:00"), now=new Date(dayKey()+"T12:00");
  return -Math.round((now-first)/864e5);
}
const planFor=k=>(S.plans[k]=S.plans[k]||[]);

function dayKey(d=new Date()){
  const x=new Date(d.getTime()-S.settings.dayStart*3600e3);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
function rollover(){
  const k=dayKey();
  if(S.lastDay===k) return;
  stopTimer();
  if(S.lastDay) snapshot(S.lastDay);
  S.tasks=S.tasks.filter(t=>t.daily||!t.done).map(t=>({...t,done:false,sec:0,carried:!t.daily}));
  Object.keys(S.plans).sort().forEach(d=>{                 // arrivals, including any missed days
    if(d>k) return;
    S.plans[d].forEach(pl=>S.tasks.push({...pl,done:false,sec:0}));
    delete S.plans[d];
  });
  if(PALETTES.length>1&&S.palette?.idx==null){
    S.palette={idx:Math.floor(Math.random()*PALETTES.length)};        // very first run
  }else if(PALETTES.length>1){
    let idx; do{ idx=Math.floor(Math.random()*PALETTES.length); }while(idx===S.palette.idx);
    S.palette={idx};
  }
  S.lastDay=k; save();
}
function snapshot(k=dayKey()){
  S.history[k]={total:S.tasks.reduce((a,b)=>a+b.sec,0),
    per:Object.fromEntries(S.tasks.filter(t=>t.sec>0).map(t=>[t.title,t.sec])),
    completed:S.tasks.filter(t=>t.done).map(t=>t.title)};
  const keys=Object.keys(S.history).sort();
  while(keys.length>120) delete S.history[keys.shift()];
}

/* ── format ───────────────────────────────── */
const clock=s=>{const h=(s/3600|0),m=(s%3600/60|0),x=s%60;
  return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`;};
const human=s=>{
  if(s<60) return s+"s";
  const h=(s/3600|0), m=((s%3600)/60|0);
  return h?`${h}h ${String(m).padStart(2,"0")}m`:`${m}m`;};
const hue=t=>`var(${HUES[(t.hueIdx||0)%HUES.length]})`;

/* ── feedback ─────────────────────────────── */
let AC=null;
function thunk(){
  if(!S.settings.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(70,t+.09);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.18);
  }catch(e){}
}
const buzz=ms=>{ if(S.settings.haptics&&navigator.vibrate) try{navigator.vibrate(ms);}catch(e){} };

/* ── actions ──────────────────────────────── */
function punch(t,el){
  if(!t.done){
    thunk(); buzz(18);
    const btn=el.querySelector(".punch"); btn.classList.add("hit");
    const c=hue(t);
    for(let i=0;i<7;i++){
      const s=document.createElement("span"); s.className="chad";
      s.style.background=c;
      s.style.setProperty("--dx",((Math.random()-.5)*90).toFixed(0)+"px");
      s.style.setProperty("--dy",(-25-Math.random()*55).toFixed(0)+"px");
      el.appendChild(s); setTimeout(()=>s.remove(),720);
    }
    if(activeId()===t.id) stopTimer();
    t.done=true; t.doneAt=Date.now();
    persist();                       // write first — the tab can freeze mid-animation
    setTimeout(render,420);
  }else{ t.done=false; persist(); render(); }
}
function toggleTimer(t){
  const wasOn = activeId()===t.id;
  stopTimer();                       // commits whatever was running
  if(!wasOn) S.running={id:t.id,since:Date.now()};
  buzz(10); persist(); render();
}
function addTask(){
  const v=$("#new").value.trim(); if(!v) return;
  if(view>0) planFor(keyAt(view)).push(mk(v,newDaily));
  else S.tasks.push(mk(v,newDaily));
  $("#new").value="";
  newDaily=false; $("#dailytog").classList.remove("on"); $("#dailytog").setAttribute("aria-pressed","false");
  buzz(8); persist(); render();
}
function removeTask(t,planKey){
  const list=planKey?planFor(planKey):S.tasks;
  const i=list.indexOf(t); undoBuf={t,i,list};
  if(activeId()===t.id) S.running=null;
  list.splice(i,1); persist(); render();
  toast("Removed “"+t.title+"”",()=>{ undoBuf.list.splice(undoBuf.i,0,undoBuf.t); persist(); render(); });
}
function toast(msg,undo){
  clearTimeout(undoTimer);
  $("#toastmsg").textContent=msg;
  const b=$("#toastact"); b.hidden=!undo;
  b.onclick=()=>{ undo&&undo(); $("#toast").classList.remove("show"); };
  $("#toast").classList.add("show");
  undoTimer=setTimeout(()=>$("#toast").classList.remove("show"),4500);
}
function persist(passive){ commit(); snapshot(); save(passive); }

/* ── render ───────────────────────────────── */
function render(){
  if(drag) return;
  rollover();
  checkAutoStop();
  applyTheme();
  if(view>MAX_AHEAD) view=MAX_AHEAD;
  if(view<backLimit()) view=backLimit();

  const key=keyAt(view), total=S.tasks.reduce((a,b)=>a+secOf(b),0);
  const d=new Date(); d.setDate(d.getDate()+view);

  $("#datelab").textContent=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}).toUpperCase();
  $("#rail").hidden = tab!=="today";
  $("#prevday").disabled = view<=backLimit();
  $("#nextday").disabled = view>=MAX_AHEAD;
  const rd=$("#railday");
  rd.textContent = view===0?"Today":dayName(view)+" · back to today";
  rd.classList.toggle("away",view!==0);
  if(tab==="today"&&view===0){
    const slot=dayKey()+":"+period();
    if(S.greeting?.slot!==slot){ S.greeting={slot,text:pickGreeting()}; save(true); }
    $("#screen").textContent = S.greeting.text;
  }else{
    $("#screen").textContent = tab==="today"?dayName(view):"Rhythm";
  }
  $("#warn").hidden = storageOK;
  paintSky();
  $("#m-today").hidden = tab!=="today";
  $("#m-rhythm").hidden = tab==="today";
  $("#composer").hidden = tab!=="today"||view<0;
  $("#new").placeholder = view>0?`Plan for ${dayName(view).toLowerCase()}…`:"Add to the card…";

  const strip=$("#strip"), lab=$(".striplab");
  if(tab==="today"&&view>0){                       // a day that hasn't happened yet
    const plan=planFor(key), dailies=S.tasks.filter(t=>t.daily);
    strip.hidden=true; lab.hidden=true;
    $("#count").textContent=`${plan.length+dailies.length} lined up`;
    renderPlan(key,plan,dailies);
  }else if(tab==="today"&&view<0){                 // a day already spent
    const h=S.history[key]||{per:{},completed:[],total:0};
    strip.hidden=false; lab.hidden=false;
    paintStrip(Object.entries(h.per||{}).map(([title,sec])=>({sec,c:hueByTitle(title)})),false);
    $("#count").textContent=`${(h.completed||[]).length} punched`;
    $("#logged").textContent=human(h.total||0)+" LOGGED";
    $("#cardlen").textContent=S.settings.cardHours+"H CARD";
    renderPast(key,h);
  }else{
    strip.hidden=false; lab.hidden=false;
    const done=S.tasks.filter(t=>t.done);
    $("#count").textContent = S.tasks.length?`${done.length}/${S.tasks.length} punched`:"";
    $("#logged").textContent=human(total)+" LOGGED";
    $("#cardlen").textContent=S.settings.cardHours+"H CARD";
    paintStrip(S.tasks.map(t=>({sec:secOf(t),c:hue(t)})),true);
    tab==="today"?renderToday(total):renderRhythm(total);
  }
}

function paintStrip(items,live){
  const cells=S.settings.cardHours*4, per=[];
  items.forEach(it=>{ const n=Math.round(it.sec/900); for(let j=0;j<n;j++) per.push(it.c); });
  const strip=$("#strip"); strip.innerHTML="";
  for(let i=0;i<cells;i++){
    const c=document.createElement("div"); c.className="cell";
    if(per[i]) c.style.background=per[i];
    if(live&&activeId()&&i===per.length) c.classList.add("now");
    strip.appendChild(c);
  }
}
const hueByTitle=title=>{ const t=S.tasks.find(x=>x.title===title); return t?hue(t):"var(--rule)"; };

/* ── a day still to come: plan it, reorder it, but nothing to punch ── */
function renderPlan(key,plan,dailies){
  const m=$("#m-today"); m.innerHTML="";
  if(!plan.length&&!dailies.length){
    m.innerHTML=`<div class="empty">Nothing lined up for ${dayName(view).toLowerCase()}.<br>
      Add something below and it'll be on the card when the day arrives.</div>`;
    return;
  }
  plan.forEach(t=>m.appendChild(planRow(t,key)));
  if(dailies.length){
    const h=document.createElement("div"); h.className="sect"; h.textContent="Arrives on its own"; m.appendChild(h);
    dailies.forEach(t=>{
      const el=document.createElement("div"); el.className="row ghost";
      el.innerHTML=`<span class="ghostdot" style="border-color:${hue(t)}"></span>
        <div class="mid"><div class="title">${esc(t.title)}</div>
        <div class="meta"><span class="chip" style="color:${hue(t)}">daily</span></div></div>`;
      m.appendChild(el);
    });
  }
}
function planRow(t,key){
  const el=document.createElement("div"); el.className="row"; el.dataset.id=t.id;
  el.innerHTML=`<span class="ghostdot" style="border-color:${hue(t)};border-style:dashed"></span>
    <div class="mid"><div class="title">${esc(t.title)}</div>
      <div class="meta">
        ${t.daily?`<span class="chip" style="color:${hue(t)}">daily</span>`:""}
        <span class="t">${t.target?t.target+"m planned":"queued"}</span>
      </div></div>`;
  el.querySelector(".mid").onclick=()=>{ if(!justDragged) taskSheet(t,key); };
  el.addEventListener("pointerdown",e=>armDrag(el,t,e));
  return el;
}

/* ── a day already spent: read-only, drawn from the record ── */
function renderPast(key,h){
  const m=$("#m-today"); m.innerHTML="";
  const titles=[...new Set([...Object.keys(h.per||{}),...(h.completed||[])])];
  if(!titles.length){ m.innerHTML=`<div class="empty">No record for this day.</div>`; return; }
  titles.forEach(title=>{
    const sec=(h.per||{})[title]||0, was=(h.completed||[]).includes(title);
    const el=document.createElement("div"); el.className="row past";
    el.innerHTML=`<span class="punch${was?" done":""}" style="pointer-events:none"></span>
      <div class="mid"><div class="title${was?" struck":""}">${esc(title)}</div>
      <div class="meta"><span class="t">${sec?clock(sec):"no time logged"}</span></div></div>`;
    m.appendChild(el);
  });
  const note=document.createElement("div"); note.className="empty"; note.style.padding="24px 0 8px";
  note.textContent="Past days are a record — nothing to change here.";
  m.appendChild(note);
}

/* Every render() call used to wipe #m-today and rebuild every row from scratch —
   including the common case of just tapping play, where only one row's icon
   actually changes. That full teardown/rebuild is what showed up as the whole
   stack visibly jumping. Reconcile against what's already there instead: reuse
   a row's existing DOM node (same position, same element) whenever the task at
   that slot is unchanged, and only create/move nodes where the list actually
   changed structurally (added, removed, punched to the other section, reordered). */
function renderToday(total){
  const m=$("#m-today");
  const open=S.tasks.filter(t=>!t.done), done=S.tasks.filter(t=>t.done);
  if(!S.tasks.length){
    m.innerHTML='<div class="empty">Blank card.<br>Type the first thing you\'ll do below.</div>'; return;
  }
  const stale=m.querySelector(".empty"); if(stale) stale.remove();

  // key by task id, not position — robust to reordering, unlike walking both lists in
  // parallel. appendChild on a node already in the DOM moves it rather than recreating
  // it, so building the final order this way reuses every unchanged row untouched.
  const byId=new Map();
  [...m.children].forEach(c=>{ if(c.classList?.contains("row")) byId.set(c.dataset.id,c); });
  let sect=[...m.children].find(c=>c.className==="sect");

  /* Place a node at the next slot, but ONLY touch the DOM if it isn't already
     there. Re-inserting a node that's already in place still counts as an
     insertion, which restarts its CSS animation — and .row carries
     `animation:rowin` (fade from opacity 0, translateY(-8px)). Re-appending
     every row on every render replayed that entry animation on the whole list,
     which is the fade-and-slide "refresh" flash on each play/pause tap. */
  let idx=0;
  const place=node=>{
    if(m.children[idx]!==node) m.insertBefore(node, m.children[idx]||null);
    idx++;
  };

  open.forEach(t=>place(row(t,total,byId.get(String(t.id)))));
  if(done.length){
    if(!sect){ sect=document.createElement("div"); sect.className="sect"; sect.textContent="Punched out"; }
    place(sect);
    done.forEach(t=>place(row(t,total,byId.get(String(t.id)))));
  }
  while(m.children.length>idx) m.removeChild(m.children[idx]);   // anything left over is stale
}

function row(t,total,existing){
  const i=S.tasks.indexOf(t), c=hue(t), on=activeId()===t.id, sec=secOf(t);
  const el=existing||document.createElement("div"); el.className="row";
  el.dataset.id=t.id; if(t.done) el.dataset.done="1"; else delete el.dataset.done;
  const pct = t.target ? Math.min(100,sec/(t.target*60)*100) : (total?sec/total*100:0);
  const html=`
    <button class="punch${t.done?" done":""}" style="${t.done?"":"border-color:"+c}"
      aria-label="${t.done?"Unpunch":"Punch out"} ${esc(t.title)}"></button>
    <div class="mid">
      <div class="title${t.done?" struck":""}">${esc(t.title)}</div>
      <div class="meta">
        ${t.daily?`<span class="chip" style="color:${c}">daily</span>`:""}
        ${t.carried&&!t.done?`<span class="chip" style="color:var(--ink-40)">carried</span>`:""}
        <span class="t${on?" live":""}">${on?"▶ "+clock(sec):sec?clock(sec):"not started"}${
          t.target?` <span style="opacity:.6">/ ${t.target}m</span>`:""}</span>
      </div>
      ${sec>0?`<div class="bar"><i style="width:${pct}%;background:${c};opacity:${t.done?.45:1}"></i></div>`:""}
    </div>
    <div class="act">${t.done?"":`<button class="play${on?" on":""}" aria-label="${on?"Pause":"Start"} timer">${
      on?'<svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="1" width="3.4" height="10" fill="currentColor"/><rect x="7.6" y="1" width="3.4" height="10" fill="currentColor"/></svg>'
        :'<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>'}</button>`}</div>`;
  /* Only touch the DOM if this row's markup actually differs. Tapping play
     re-renders the whole card, but just one row's markup really changes; the
     others were being wiped and rebuilt identically. That destroy/recreate
     momentarily collapses each row's height, and the phone paints that
     in-between frame — the whole stack visibly jumping up and back down. */
  if(el.__sig!==html){ el.__sig=html; el.innerHTML=html; }

  /* Handlers are rebound every time even when the markup was reused: rollover()
     rebuilds task objects with the same ids, so a retained closure could otherwise
     point at a stale copy. These are plain property assignments — no DOM churn,
     and using .on*= rather than addEventListener means they replace, never stack. */
  el.querySelector(".punch").onclick=()=>punch(t,el);
  el.querySelector(".mid").onclick=()=>{ if(!justDragged) taskSheet(t); };
  const p=el.querySelector(".play"); if(p) p.onclick=()=>toggleTimer(t);
  el.onpointerdown = t.done ? null : e=>armDrag(el,t,e);
  return el;
}
const esc=s=>s.replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

/* ── rhythm / stats ───────────────────────── */
function renderRhythm(total){
  const m=$("#m-rhythm");
  const keys=lastNDays(14), vals=keys.map(k=>k===dayKey()?total:(S.history[k]?.total||0));
  const wk=vals.slice(-7), avg=wk.length?wk.reduce((a,b)=>a+b,0)/wk.length:0;
  const best=Math.max(...vals,1);
  const per=S.tasks.filter(t=>secOf(t)>0).map(t=>({n:t.title,m:Math.round(secOf(t)/60),c:hue(t)}))
    .sort((a,b)=>b.m-a.m);
  const streaks=S.tasks.filter(t=>t.daily);

  m.innerHTML=`
    <div class="sect">Time on the card today</div>
    <div class="big">${human(total)}</div>
    <div class="note">${per.length?`Across ${per.length} task${per.length>1?"s":""}. `:""}Seven-day average ${human(Math.round(avg))}.</div>
    <div class="kpis">
      <div class="kpi"><b>${S.tasks.filter(t=>t.done).length}</b><span>punched today</span></div>
      <div class="kpi"><b>${human(Math.max(...vals))}</b><span>best day</span></div>
      <div class="kpi"><b>${human(vals.reduce((a,b)=>a+b,0))}</b><span>14-day total</span></div>
    </div>

    <div class="sect">Where it went</div>
    ${per.length?hbars(per):'<div class="note">No time logged yet today. Hit play on a task to start the clock.</div>'}

    <div class="sect">Last fourteen days</div>
    ${vbars(keys,vals,best)}

    ${streaks.length?'<div class="sect">Daily streaks</div>'+streaks.map(t=>{
      const days=lastNDays(10);
      const hits=days.map(k=>k===dayKey()?t.done:(S.history[k]?.completed||[]).includes(t.title));
      let run=0; for(let i=hits.length-1;i>=0;i--){ if(hits[i]) run++; else if(i!==hits.length-1) break; }
      return `<div class="streak"><div class="srow"><span style="font-size:14px;font-weight:500">${esc(t.title)}</span>
        <span class="t">${run} day${run===1?"":"s"} running</span></div>
        <div class="dots">${hits.map((h,i)=>`<div class="dot${h?" hit":""}${i===hits.length-1?" today":""}"></div>`).join("")}</div></div>`;
    }).join(""):""}
    <div style="height:20px"></div>`;
}
function lastNDays(n){
  const out=[],base=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(base); d.setDate(d.getDate()-i); out.push(dayKey(d)); }
  return out;
}
function hbars(per){
  const max=Math.max(...per.map(p=>p.m),1), h=per.length*30+6;
  return `<svg viewBox="0 0 300 ${h}" width="100%" height="${h}" role="img">`+
    per.map((p,i)=>{
      const y=i*30+4, w=Math.max(2,p.m/max*168);
      return `<text x="0" y="${y+15}" font-size="11">${esc(p.n.length>13?p.n.slice(0,12)+"…":p.n)}</text>
        <rect x="106" y="${y+5}" width="${w}" height="13" rx="3" fill="${p.c}"/>
        <text x="${112+w}" y="${y+16}" font-size="10">${p.m}m</text>`;
    }).join("")+`</svg>`;
}
function vbars(keys,vals,best){
  const n=keys.length,W=300,H=120,bw=W/n-4;
  return `<svg viewBox="0 0 ${W} ${H+18}" width="100%" height="${H+18}" role="img">`+
    vals.map((v,i)=>{
      const bh=Math.max(2,v/best*H), x=i*(W/n)+2, y=H-bh;
      const lab=new Date(keys[i]+"T12:00").toLocaleDateString(undefined,{weekday:"narrow"});
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3"
        fill="${i===n-1?"var(--violet)":"var(--tray)"}"/>
        <text x="${x+bw/2}" y="${H+13}" font-size="9" text-anchor="middle">${lab}</text>`;
    }).join("")+`</svg>`;
}

/* ── the sky ──────────────────────────────────
   Time of day is computed locally and always available. Weather is opt-in:
   it's the one feature that talks to the network. Drawn flat, in the card's
   own palette, so it reads as part of the stock rather than a widget. */
const SKY={night:"#141B2E",dawn:"#E8A06B",day:"#A9C9DE",dusk:"#C87A61"};
const WXNAME={clear:"Clear",cloud:"Cloudy",fog:"Fog",rain:"Rain",snow:"Snow",storm:"Thunderstorms"};

function moonAge(d=new Date()){                    // 0 = new, .5 = full
  const syn=29.530588853, ref=Date.UTC(2000,0,6,18,14);
  return ((((d-ref)/864e5)%syn)+syn)%syn/syn;
}
/* The lit limb as one plain path: the rim on the lit side, then the terminator
   back the other way. No masks, no gradients — renders the same everywhere. */
function moonPath(cx,cy,r,p){
  const k=Math.cos(2*Math.PI*p), rx=Math.abs(k)*r;
  const side=p<0.5?1:-1, tsign=k>0?1:-1, N=28, pts=[];
  for(let i=0;i<=N;i++){ const a=-Math.PI/2+Math.PI*i/N;
    pts.push([cx+side*r*Math.cos(a), cy+r*Math.sin(a)]); }
  for(let i=N;i>=0;i--){ const a=-Math.PI/2+Math.PI*i/N;
    pts.push([cx+side*tsign*rx*Math.cos(a), cy+r*Math.sin(a)]); }
  return "M"+pts.map(([x,y])=>x.toFixed(2)+","+y.toFixed(2)).join("L")+"Z";
}
const moonName=p=>["New moon","Waxing crescent","First quarter","Waxing gibbous","Full moon",
  "Waning gibbous","Last quarter","Waning crescent"][Math.round(p*8)%8];

function phaseNow(){
  const sk=S.sky||{}, now=Date.now();
  if(sk.sunrise&&sk.sunset){                       // real times when weather is on
    const up=+new Date(sk.sunrise), dn=+new Date(sk.sunset), band=45*6e4;
    if(now<up-band||now>dn+band) return "night";
    if(now<up+band) return "dawn";
    if(now>dn-band) return "dusk";
    return "day";
  }
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  if(h<5.5||h>=20.5) return "night";
  if(h<7.5) return "dawn";
  if(h>=18.5) return "dusk";
  return "day";
}
const WX=c=>c==null?null:c===0?"clear":c<=3?"cloud":(c===45||c===48)?"fog":
  ((c>=51&&c<=67)||(c>=80&&c<=82))?"rain":((c>=71&&c<=77)||c===85||c===86)?"snow":c>=95?"storm":"cloud";

function skySVG(){
  const ph=phaseNow(), night=ph==="night";
  const sk=S.sky||{};
  const wx=S.settings.weather?WX(sk.code):null;
  const cloudy=wx&&wx!=="clear"&&wx!=="fog";
  // how many small clouds to draw, not how big one cloud gets — real cloud_cover % when we
  // have it (0-100 from open-meteo), a flat guess if weather's on but cover hasn't loaded yet,
  // or a single decorative puff when weather tracking is off entirely.
  const cloudCount = cloudy ? (sk.cover!=null ? (sk.cover<15?0:sk.cover<40?1:sk.cover<70?2:3) : 2)
    : (!S.settings.weather&&(night||ph==="day")) ? 1 : 0;

  /* No background rectangle and no mask. Elements float on transparency and
     sit directly on the card, so there is no box edge to catch the light. */
  const defs=`<defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="${night?"#B79CF0":"#FFDA92"}" stop-opacity="${night?.5:.7}"/>
      <stop offset=".55" stop-color="${night?"#7B5FD1":"#FFCB76"}" stop-opacity="${night?.2:.3}"/>
      <stop offset="1" stop-color="${night?"#7B5FD1":"#FFCB76"}" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x1=".1" y1=".05" x2=".9" y2="1">
      <stop offset="0" stop-color="#CBB4FF"/>
      <stop offset=".55" stop-color="#9575E8"/>
      <stop offset="1" stop-color="#5C3FAE"/></linearGradient>
    <linearGradient id="sun" x1=".1" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFCF0"/><stop offset="1" stop-color="#F8A72F"/></linearGradient>
    <linearGradient id="cl" x1=".2" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#E7EEF7"/>
      <stop offset="1" stop-color="#B9C6DC"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#BFE0FF"/>
      <stop offset="1" stop-color="#4E93E0"/></linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9FC6E8"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A0"/><stop offset="1" stop-color="#FFA318"/></linearGradient>
    <radialGradient id="boltGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD873" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD873" stop-opacity="0"/></radialGradient>
  </defs>`;

  let g="";

  if(night){
    // stars, scattered to the left of the moon
    g+=[[24,20,1.5,.9],[36,12,1,.6],[30,33,1.2,.75],[16,30,1.3,.8],[44,26,.85,.5],[52,15,.7,.45]]
      .map(([x,y,r,o])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#FFFBEF" opacity="${o}"/>`).join("");
    // a four-point sparkle, like the reference
    g+=`<path d="M92 12c.5 3.4 1.4 4.3 4.8 4.8-3.4.5-4.3 1.4-4.8 4.8-.5-3.4-1.4-4.3-4.8-4.8 3.4-.5 4.3-1.4 4.8-4.8z"
        fill="#FFF6DC" opacity=".95"/>`;
  }

  // smaller and shifted up when weather-driven clouds are in front — reads as "further back".
  // the single decorative puff (weather off) doesn't shrink it, same as before.
  const cx=72, r=cloudy?11:15, cy=cloudy?18:27;

  // a storm hides the sun/moon entirely rather than shrinking it behind the clouds —
  // nothing to peek through when it's actually stormy
  if(wx!=="storm"){
    g+=`<circle cx="${cx}" cy="${cy}" r="${r*1.9}" fill="url(#glow)"/>`;
    if(night){
      // true crescent from the real moon phase — same math the Rhythm tab uses for the phase name
      g+=`<path d="${moonPath(cx,cy,r,moonAge())}" fill="url(#moon)"/>`;
    }else{
      g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#sun)"/>
          <ellipse cx="${cx-r*.33}" cy="${cy-r*.4}" rx="${r*.4}" ry="${r*.3}" fill="#FFFFFF" opacity=".4"/>`;
    }
  }

  // three different cloud silhouettes — not one shape rescaled — so a multi-cloud sky
  // reads as an actual formation instead of the same puff cloned smaller
  const cloudA=(x,y,sc,o)=>`<g opacity="${o}">
    <circle cx="${x-7*sc}" cy="${y-4*sc}" r="${9*sc}" fill="url(#cl)"/>
    <circle cx="${x+5*sc}" cy="${y}" r="${12*sc}" fill="url(#cl)"/>
    <ellipse cx="${x-2*sc}" cy="${y-9*sc}" rx="${5*sc}" ry="${2.6*sc}" fill="#FFFFFF" opacity=".55"/></g>`;
  const cloudB=(x,y,sc,o)=>`<g opacity="${o}">
    <circle cx="${x-9*sc}" cy="${y-2*sc}" r="${7*sc}" fill="url(#cl)"/>
    <circle cx="${x+2*sc}" cy="${y-5*sc}" r="${9*sc}" fill="url(#cl)"/>
    <circle cx="${x+9*sc}" cy="${y+2*sc}" r="${8.5*sc}" fill="url(#cl)"/>
    <ellipse cx="${x-1*sc}" cy="${y-10*sc}" rx="${4.5*sc}" ry="${2.3*sc}" fill="#FFFFFF" opacity=".5"/></g>`;
  const cloudC=(x,y,sc,o)=>`<g opacity="${o}">
    <circle cx="${x-10*sc}" cy="${y-6*sc}" r="${13*sc}" fill="url(#cl)"/>
    <circle cx="${x+9*sc}" cy="${y-2*sc}" r="${16*sc}" fill="url(#cl)"/>
    <circle cx="${x-2*sc}" cy="${y+4*sc}" r="${14*sc}" fill="url(#cl)"/>
    <ellipse cx="${x-4*sc}" cy="${y-13*sc}" rx="${7*sc}" ry="${3.4*sc}" fill="#FFFFFF" opacity=".55"/></g>`;

  // back-to-front slots; cloudCount picks from the back so a lone cloud still sits in the
  // "main" spot next to the sun/moon. bottom = lowest point each shape reaches, for placing
  // precipitation cleanly beneath whatever's actually on screen instead of a fixed guess.
  const slots=[
    {fn:cloudA, x:42, y:34, sc:.5,  o:.55, bottom:40},
    {fn:cloudB, x:60, y:48, sc:.62, o:.78, bottom:54.5},
    {fn:cloudC, x:82, y:40, sc:.65, o:.95, bottom:51.7},
  ];
  const active=slots.slice(3-cloudCount);
  active.forEach(s=>{ g+=s.fn(s.x,s.y,s.sc,s.o); });
  const precipY=active.length?Math.max(...active.map(s=>s.bottom))+1.5:56;

  if(wx==="rain")
    g+=[0,1,2,3,4].map(i=>{
      const x=50+i*8, y=precipY+(i%2)*2;
      // a thin white streak beside each drop for a bit of glossy depth
      return `<line x1="${x+1.3}" y1="${y+.5}" x2="${x-1}" y2="${y+6}" stroke="#FFFFFF"
          stroke-width=".9" stroke-linecap="round" opacity=".35"/>
        <line x1="${x}" y1="${y}" x2="${x-2.4}" y2="${y+6}" stroke="url(#drop)"
          stroke-width="2" stroke-linecap="round" opacity="${i%2?.85:1}"/>`;
    }).join("");
  if(wx==="snow")
    g+=[50,62,74].map((x,i)=>`<circle cx="${x}" cy="${precipY+2+(i%2)*2}" r="2.8" fill="url(#snow)" opacity=".95"/>`).join("");
  if(wx==="storm")
    g+=`<circle cx="70" cy="${precipY+4}" r="10" fill="url(#boltGlow)"/>
        <path d="M71 ${precipY-1}l-4.6 6.3h3.1l-1.8 4.6 6.4-7.3h-3.3l3.3-3.6z" fill="url(#bolt)"/>`;
  if(wx==="fog")
    g+=[30,39,48].map((y,i)=>`<rect x="${40+i*6}" y="${y}" width="${58-i*12}" height="5" rx="2.5"
      fill="url(#cl)" opacity="${.8-i*.14}"/>`).join("");

  return `<svg viewBox="0 0 104 64" width="104" height="64" xmlns="http://www.w3.org/2000/svg">${defs}${g}</svg>`;
}

/* render() calls this on every repaint — including just tapping play, which has
   nothing to do with the sky. Rebuilding the gradient-heavy SVG from scratch every
   time was visible as a flicker on real devices. Skip the rebuild unless something
   that actually affects the art changed (moonAge rounded to the minute — plenty
   precise for a crescent that shifts over weeks, not seconds). */
let lastSkyKey=null;
function paintSky(){
  const el=$("#sky"); if(!el) return;
  el.hidden=!S.settings.sky;
  if(!S.settings.sky) return;
  const sk=S.sky||{};
  const key=[phaseNow(),S.settings.weather,sk.code,sk.cover,moonAge().toFixed(4)].join("|");
  if(key===lastSkyKey) return;
  lastSkyKey=key;
  el.innerHTML=skySVG();
}
function skyTell(){
  const ph=phaseNow(), sk=S.sky||{}, bits=[];
  bits.push(ph==="night"?moonName(moonAge()):{dawn:"Dawn",day:"Daylight",dusk:"Dusk"}[ph]);
  if(S.settings.weather&&sk.code!=null){
    bits.push(WXNAME[WX(sk.code)]);
    if(sk.temp!=null) bits.push(Math.round(sk.temp)+"°");
  }
  if(sk.sunset&&ph!=="night")
    bits.push("sunset "+new Date(sk.sunset).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
  if(sk.sunrise&&ph==="night")
    bits.push("sunrise "+new Date(sk.sunrise).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}));
  toast(bits.filter(Boolean).join(" · "));
}

async function refreshWeather(force){
  if(!S.settings.weather||!navigator.onLine) return;
  const sk=S.sky||{};
  if(!force&&sk.at&&Date.now()-sk.at<18e5) return;      // half-hourly at most
  try{
    let lat=sk.lat, lon=sk.lon;
    if(lat==null){
      const pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,
        {timeout:9000,maximumAge:6e5}));
      lat=Math.round(pos.coords.latitude*10)/10;        // ~10km — enough for weather
      lon=Math.round(pos.coords.longitude*10)/10;
    }
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
      `&current=temperature_2m,weather_code,cloud_cover&daily=sunrise,sunset&timezone=auto&forecast_days=1`);
    const j=await r.json();
    S.sky={at:Date.now(),lat,lon,code:j.current.weather_code,temp:j.current.temperature_2m,
      cover:j.current.cloud_cover,sunrise:j.daily.sunrise[0],sunset:j.daily.sunset[0]};
    save(); paintSky(); applyTheme();
  }catch(e){ /* offline, denied, or unreachable — the clock-based sky still stands */ }
}

/* ── drag to reorder ──────────────────────────
   Hold a task for a moment to lift it, then drag. Siblings animate out of
   the way with a FLIP transition; the list order is written on drop. */
let drag=null, justDragged=false, edgeScroll=null;

function armDrag(el,t,e){
  if(drag||e.isPrimary===false||(e.pointerType==="mouse"&&e.button!==0)) return;
  if(e.target.closest(".punch,.play")) return;
  const x0=e.clientX, y0=e.clientY;
  let hold=setTimeout(()=>{ hold=null; off(); lift(el,y0); },230);
  const move=ev=>{ if(Math.hypot(ev.clientX-x0,ev.clientY-y0)>10) done(); };
  const done=()=>{ if(hold){clearTimeout(hold);hold=null;} off(); };
  function off(){
    document.removeEventListener("pointermove",move);
    document.removeEventListener("pointerup",done);
    document.removeEventListener("pointercancel",done);
  }
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",done);
  document.addEventListener("pointercancel",done);
}

function lift(el,y){
  drag={el,grab:y-el.getBoundingClientRect().top,dy:0};
  buzz(16);
  el.classList.add("lift");
  place(y);
  document.addEventListener("pointermove",onDragMove);
  document.addEventListener("pointerup",onDrop);
  document.addEventListener("pointercancel",onDrop);
}

function place(clientY){
  const el=drag.el;
  const natural=el.getBoundingClientRect().top-drag.dy;
  drag.dy=(clientY-drag.grab)-natural;
  el.style.transform=`translateY(${drag.dy}px) scale(1.02)`;
}

function onDragMove(e){
  if(!drag) return;
  place(e.clientY);
  edge(e.clientY);
  const el=drag.el;
  el.style.pointerEvents="none";
  const under=document.elementFromPoint(e.clientX,e.clientY);
  el.style.pointerEvents="";
  const other=under&&under.closest(".row");
  if(!other||other===el||other.dataset.done||other.parentNode!==el.parentNode) return;
  const r=other.getBoundingClientRect();
  const before=e.clientY<r.top+r.height/2;
  const anchor=before?other:other.nextSibling;
  if(anchor===el) return;
  flip(()=>el.parentNode.insertBefore(el,anchor));
  place(e.clientY);
}

function flip(mutate){
  const others=$$("#m-today .row").filter(r=>r!==drag.el);
  const was=new Map(others.map(r=>[r,r.getBoundingClientRect().top]));
  mutate();
  others.forEach(r=>{
    const d=was.get(r)-r.getBoundingClientRect().top;
    if(Math.abs(d)<0.5) return;
    r.style.transition="none"; r.style.transform=`translateY(${d}px)`;
    requestAnimationFrame(()=>{ r.style.transition="transform .18s cubic-bezier(.2,.9,.3,1)";
      r.style.transform=""; });
  });
}

/* nudge the list when you drag near its top or bottom edge */
function edge(y){
  const m=$("#m-today"), r=m.getBoundingClientRect();
  const up=y<r.top+64, down=y>r.bottom-64;
  clearInterval(edgeScroll); edgeScroll=null;
  if(!up&&!down) return;
  edgeScroll=setInterval(()=>{
    if(!drag){ clearInterval(edgeScroll); return; }
    const before=m.scrollTop;
    m.scrollTop+=up?-9:9;
    if(m.scrollTop!==before) drag.dy+=up?-9:9, drag.el.style.transform=`translateY(${drag.dy}px) scale(1.02)`;
  },16);
}

function onDrop(){
  if(!drag) return;
  clearInterval(edgeScroll); edgeScroll=null;
  const el=drag.el;
  el.style.transition="transform .2s cubic-bezier(.2,.9,.3,1.1)";
  el.style.transform="translateY(0) scale(1)";
  const order=$$("#m-today .row").map(r=>r.dataset.id);
  const rank=new Map(order.map((id,i)=>[id,i]));
  const list=view>0?planFor(keyAt(view)):S.tasks;
  list.sort((a,b)=>(rank.get(a.id)??1e6)-(rank.get(b.id)??1e6));
  drag=null; justDragged=true;
  setTimeout(()=>justDragged=false,320);
  buzz(10);
  setTimeout(()=>{ el.classList.remove("lift"); el.style.transition=""; el.style.transform="";
    $$("#m-today .row").forEach(r=>{r.style.transition="";r.style.transform="";});
    persist(); render(); },200);
  document.removeEventListener("pointermove",onDragMove);
  document.removeEventListener("pointerup",onDrop);
  document.removeEventListener("pointercancel",onDrop);
}

/* ── swipe between days ───────────────────────
   Horizontal only, and only once the finger has clearly committed sideways —
   otherwise it would fight the vertical scroll and the long-press lift. */
let swipe=null;

function goDay(n){
  const from=view;
  view=Math.max(backLimit(),Math.min(MAX_AHEAD,view+n));
  if(view===from){ bounce(n); return; }
  const m=$("#m-today");
  m.style.transition="none";
  m.style.transform=`translateX(${n>0?28:-28}px)`; m.style.opacity="0";
  render();
  requestAnimationFrame(()=>{
    m.style.transition="transform .22s cubic-bezier(.2,.9,.3,1),opacity .18s ease";
    m.style.transform=""; m.style.opacity="1";
  });
  buzz(8);
}
function bounce(n){
  const m=$("#m-today");
  m.style.transition="transform .18s ease";
  m.style.transform=`translateX(${n>0?-14:14}px)`;
  setTimeout(()=>{ m.style.transform=""; },140);
}

$("#m-today").addEventListener("pointerdown",e=>{
  if(drag||tab!=="today"||(e.pointerType==="mouse"&&e.button!==0)) return;
  swipe={x:e.clientX,y:e.clientY,t:Date.now(),on:false,dead:false};
});
document.addEventListener("pointermove",e=>{
  if(!swipe||swipe.dead||drag) return;
  const dx=e.clientX-swipe.x, dy=e.clientY-swipe.y;
  if(!swipe.on){
    if(Math.abs(dx)<8&&Math.abs(dy)<8) return;       // too small to read intent yet
    if(Math.abs(dx)>=Math.abs(dy)) swipe.on=true;    // a thumb arcs; simple comparison is enough
    else { swipe.dead=true; return; }                // clearly a scroll — let it go
  }
  const m=$("#m-today");
  m.style.transition="none";
  m.style.transform=`translateX(${dx*0.4}px)`;
  m.style.opacity=String(Math.max(.45,1-Math.abs(dx)/420));
});
function endSwipe(e){
  if(!swipe) return;
  const on=swipe.on, dx=(e.clientX??swipe.x)-swipe.x;
  const speed=Math.abs(dx)/Math.max(1,Date.now()-swipe.t);   // px per ms
  swipe=null;
  const m=$("#m-today");
  if(!on){ m.style.transform=""; m.style.opacity="1"; return; }
  m.style.transition="transform .2s ease,opacity .2s ease";
  m.style.transform=""; m.style.opacity="1";
  /* a long drag OR a short flick both count */
  if(Math.abs(dx)>50||(speed>0.35&&Math.abs(dx)>18)) goDay(dx<0?1:-1);
}
document.addEventListener("pointerup",endSwipe);
document.addEventListener("pointercancel",endSwipe);
document.addEventListener("touchmove",e=>{ if(swipe&&swipe.on) e.preventDefault(); },{passive:false});

/* a lifted row owns the gesture: no page scroll, no long-press menu */
document.addEventListener("touchmove",e=>{ if(drag) e.preventDefault(); },{passive:false});
document.addEventListener("contextmenu",e=>{ if(drag) e.preventDefault(); });

/* ── sheets ───────────────────────────────── */
function openSheet(html){ $("#sheetbody").innerHTML=html; $("#sheet").classList.add("open"); $("#scrim").classList.add("open"); }
function closeSheet(){ $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open"); }
$("#scrim").onclick=closeSheet;

function taskSheet(t,planKey){
  commit(); save();
  const list=planKey?planFor(planKey):S.tasks;
  const i=list.indexOf(t);
  openSheet(`
    <h2>Edit task</h2>
    <div class="field"><label>Name</label><input type="text" id="e-title" value="${esc(t.title)}"></div>
    <div class="field"><label>Target time</label><div class="pillrow" id="e-target">
      ${[0,15,30,45,60,90,120].map(v=>`<button class="pill${(t.target||0)===v?" on":""}" data-v="${v}">${v?v+"m":"none"}</button>`).join("")}
    </div></div>
    ${planKey?"":`<div class="field"><label>Logged so far — ${clock(t.sec)}</label><div class="pillrow">
      ${[-15,-5,5,15].map(v=>`<button class="pill" data-adj="${v}">${v>0?"+":""}${v}m</button>`).join("")}
      <button class="pill" data-adj="reset">clear</button>
    </div></div>`}
    <div class="srowline">Repeat every day<button class="switch${t.daily?" on":""}" id="e-daily"></button></div>
    <div class="pillrow" style="margin:14px 0">
      <button class="pill" data-move="-1" ${i===0?"disabled":""}>↑ move up</button>
      <button class="pill" data-move="1" ${i===list.length-1?"disabled":""}>↓ move down</button>
    </div>
    <button class="sbtn" id="e-save">Save changes</button>
    <button class="sbtn danger" id="e-del" style="margin-top:8px">Remove from card</button>`);

  $$("#e-target .pill").forEach(b=>b.onclick=()=>{ $$("#e-target .pill").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); });
  $$("[data-adj]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.adj;
    t.sec = v==="reset"?0:Math.max(0,t.sec+parseInt(v)*60);
    persist(); render(); taskSheet(t);
  });
  $("#e-daily").onclick=e=>e.target.classList.toggle("on");
  $$("[data-move]").forEach(b=>b.onclick=()=>{
    const j=i+parseInt(b.dataset.move); if(j<0||j>=list.length) return;
    list.splice(j,0,list.splice(i,1)[0]); persist(); render(); closeSheet();
  });
  $("#e-save").onclick=()=>{
    const nt=$("#e-title").value.trim(); if(nt) t.title=nt;
    t.daily=$("#e-daily").classList.contains("on");
    const sel=$("#e-target .pill.on"); t.target=sel?(parseInt(sel.dataset.v)||null):null;
    persist(); render(); closeSheet();
  };
  $("#e-del").onclick=()=>{ closeSheet(); removeTask(t,planKey); };
}

function settingsSheet(){
  const st=S.settings;
  openSheet(`
    <h2>Settings</h2>
    <div class="field"><label>Look</label><div class="pillrow" id="s-theme">
      ${["light","dark","auto","sky"].map(v=>`<button class="pill${st.theme===v?" on":""}" data-t="${v}">${
        v==="sky"?"follow the sun":v}</button>`).join("")}
    </div></div>
    <div class="field"><label>Card length — how much focus fills the strip</label><div class="pillrow" id="s-hours">
      ${[4,6,8,10].map(v=>`<button class="pill${st.cardHours===v?" on":""}" data-h="${v}">${v}h</button>`).join("")}
    </div></div>
    <div class="field"><label>New day starts at</label><div class="pillrow" id="s-start">
      ${[0,3,4,5,6].map(v=>`<button class="pill${st.dayStart===v?" on":""}" data-s="${v}">${v}:00</button>`).join("")}
    </div></div>
    <div class="field"><label>Auto-stop a timer left running</label><div class="pillrow" id="s-auto">
      ${[0,2,4,8].map(v=>`<button class="pill${st.autoStop===v?" on":""}" data-a="${v}">${v?"after "+v+"h":"never"}</button>`).join("")}
    </div></div>
    <div class="srowline">Sky in the header<button class="switch${st.sky?" on":""}" data-set="sky"></button></div>
    <div class="srowline">Use local weather<button class="switch${st.weather?" on":""}" id="s-wx"></button></div>
    <div class="srowline">Punch sound<button class="switch${st.sound?" on":""}" data-set="sound"></button></div>
    <div class="srowline">Vibration<button class="switch${st.haptics?" on":""}" data-set="haptics"></button></div>
    <div style="height:16px"></div>
    <button class="sbtn ghost" id="s-export">Export a backup file</button>
    <button class="sbtn ghost" id="s-import" style="margin-top:8px">Restore from backup</button>
    <button class="sbtn danger" id="s-wipe" style="margin-top:8px">Erase everything</button>
    <p class="note">Weather asks your phone for a rough location (rounded to about 10km) and fetches
      the forecast from open-meteo.com. That request is the only time this app touches the internet.
      Leave it off and the sky still follows the clock.</p>
    <p class="note" style="text-align:center">Everything else stays on this device.<br>
      ${storageOK?`Saved ${S.savedAt?new Date(S.savedAt).toLocaleTimeString():"—"} · revision ${S.rev}`
                 :"⚠ Storage unavailable — nothing is being saved."}<br>
      <span id="s-version" style="font-family:var(--mono);letter-spacing:.08em">v${VERSION}</span></p>`);

  $$("#s-theme .pill").forEach(b=>b.onclick=()=>{ st.theme=b.dataset.t; save(); applyTheme(); settingsSheet(); });
  $$("#s-hours .pill").forEach(b=>b.onclick=()=>{ st.cardHours=+b.dataset.h; save(); render(); settingsSheet(); });
  $$("#s-start .pill").forEach(b=>b.onclick=()=>{ st.dayStart=+b.dataset.s; save(); render(); settingsSheet(); });
  $$("#s-auto .pill").forEach(b=>b.onclick=()=>{ st.autoStop=+b.dataset.a; save(); settingsSheet(); });
  $$("[data-set]").forEach(b=>b.onclick=()=>{ st[b.dataset.set]=!st[b.dataset.set]; b.classList.toggle("on");
    save(); if(b.dataset.set==="sound"&&st.sound) thunk(); });
  $("#s-wx").onclick=e=>{
    st.weather=!st.weather; e.target.classList.toggle("on",st.weather);
    if(!st.weather) S.sky=null;
    save(); paintSky(); applyTheme();
    if(st.weather) refreshWeather(true);
  };
  $("#s-export").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="punchcard-"+dayKey()+".json"; a.click();
  };
  $("#s-import").onclick=()=>{
    const f=document.createElement("input"); f.type="file"; f.accept=".json,application/json";
    f.onchange=()=>{ const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.tasks) throw 0;
        S=d; S.settings={...blank.settings,...(d.settings||{})}; save(); closeSheet(); render(); toast("Backup restored");
      }catch(e){ toast("That file isn't a Punchcard backup"); } };
      r.readAsText(f.files[0]); };
    f.click();
  };
  $("#s-wipe").onclick=()=>{
    if(!confirm("Erase all tasks and history? This can't be undone.")) return;
    S=JSON.parse(JSON.stringify(blank)); S.lastDay=dayKey(); save(); closeSheet(); render();
  };
}

function applyTheme(){
  const t=S.settings.theme, ph=phaseNow();
  const dark = t==="dark" || (t==="auto" && matchMedia("(prefers-color-scheme: dark)").matches)
    || (t==="sky" && (ph==="night"||ph==="dusk"));
  document.documentElement.dataset.theme = dark?"dark":"light";
  $('meta[name=theme-color]').setAttribute("content", dark?"#1B1922":"#EFEAE0");
  paintPalette();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>applyTheme());

/* ── wiring ───────────────────────────────── */
$("#addbtn").onclick=addTask;
$("#new").addEventListener("keydown",e=>{ if(e.key==="Enter") addTask(); });
$("#dailytog").onclick=e=>{ newDaily=!newDaily; e.target.classList.toggle("on",newDaily);
  e.target.setAttribute("aria-pressed",newDaily); };
$("#gear").onclick=settingsSheet;
setInterval(()=>{ if(drag) return; paintSky(); applyTheme(); refreshWeather(); },3e5);
$("#prevday").onclick=()=>goDay(-1);
$("#nextday").onclick=()=>goDay(1);
$("#railday").onclick=()=>{ if(view!==0) goDay(-view); };
document.addEventListener("keydown",e=>{
  if(tab!=="today"||e.target.tagName==="INPUT"||$("#sheet").classList.contains("open")) return;
  if(e.key==="ArrowLeft") goDay(-1);
  if(e.key==="ArrowRight") goDay(1);
});
$$("nav button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; if(tab==="rhythm") view=0;
  $$("nav button").forEach(x=>x.setAttribute("aria-selected",x===b)); render();
});

/* heartbeat: repaints the running row. It does NOT accumulate time —
   elapsed always comes from the stored start timestamp, so a throttled
   or suspended interval can't lose (or invent) a single second. */
setInterval(()=>{
  if(!S.running) return;
  if(checkAutoStop()){ render(); return; }
  const t=S.tasks.find(x=>x.id===S.running.id); if(!t){ S.running=null; return; }
  const sec=secOf(t);
  if(view!==0||tab!=="today"){ if(sec%20===0) persist(true); return; }
  const rows=$$("#m-today .row"), open=S.tasks.filter(x=>!x.done);
  const el=rows[open.indexOf(t)];
  if(el){
    const lab=el.querySelector(".t"); if(lab) lab.firstChild.textContent="\u25B6 "+clock(sec)+" ";
    const bar=el.querySelector(".bar i");
    if(!bar) render();
    else if(t.target) bar.style.width=Math.min(100,sec/(t.target*60)*100)+"%";
  }
  $("#logged").textContent=human(S.tasks.reduce((a,b)=>a+secOf(b),0))+" LOGGED";
  if(sec%20===0){ persist(true); if(sec%900===0) render(); }
},1000);

/* coming back from a locked screen or another app: nothing to reconcile,
   the timestamp already knows. Just repaint (and honour the session cap). */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) persist(true);          // passive: can't clobber a newer copy
  else { S=load(); render(); }                // always re-read on return
});
window.addEventListener("pageshow",()=>{ S=load(); render(); });
window.addEventListener("pagehide",()=>persist(true));   // beforeunload is unreliable on Android

/* another tab of the same app saved something newer */
window.addEventListener("storage",e=>{
  if(e.key!==KEY||!e.newValue) return;
  try{ const cur=JSON.parse(e.newValue);
    if((cur.rev||0)>(S.rev||0)){ S=hydrate(cur); queueRender(); }
  }catch(_){}
});
window.addEventListener("beforeunload",()=>persist(true));

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!S.lastDay) S.lastDay=dayKey();
render(); save(); refreshWeather();
</script>
</body>
</html>
